<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — CineMatrix</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 35px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 20px; color: #fff; font-size: 22px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background-color: #0b0f19;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        input:focus {
            border-color: #e50914;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #b91c1c; }
        .links { text-align: center; margin-top: 20px; font-size: 13px; }
        .links a { color: #94a3b8; text-decoration: none; }
        .links a:hover { color: #fff; text-decoration: underline; }
        .err { color: #f87171; font-size: 13px; margin-bottom: 14px; background: rgba(229,9,20,0.1); padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="box">
    <h2>Регистрация</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="err">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form method="POST">
        <input type="text" name="username" placeholder="Ваше имя" required>
        <input type="email" name="email" placeholder="Электронная почта" required>
        <input type="password" name="password" placeholder="Придумайте пароль" required>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <div class="links">
        <a href="/login">Уже есть аккаунт? Войти</a> • <a href="/">На главную</a>
    </div>
</div>
</body>
</html>
